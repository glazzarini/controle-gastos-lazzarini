<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1117">
<title>Gastos · Lazzarini</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #0f1117;
  --surface:  #181c27;
  --surface2: #1e2436;
  --border:   #2a3148;
  --accent:   #4f8ef7;
  --accent2:  #7c3aed;
  --green:    #22c55e;
  --amber:    #f59e0b;
  --red:      #ef4444;
  --text:     #e8eaf0;
  --muted:    #8892a4;
  --card-r:   16px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%;font-size:16px}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'DM Sans',sans-serif;
  font-weight:400;
  min-height:100%;
  display:flex;
  flex-direction:column;
  overscroll-behavior:none;
}

/* ── TOPBAR ───────────────────────────────────────────────────────────────── */
.topbar{
  position:sticky;top:0;z-index:100;
  background:var(--bg);
  padding:calc(var(--safe-top) + 12px) 20px 12px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.topbar-title{font-size:17px;font-weight:600;letter-spacing:-.3px}
.topbar-sub{font-size:12px;color:var(--muted);font-family:'DM Mono',monospace}
.month-badge{
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:8px;
  padding:5px 10px;
  font-size:12px;
  font-family:'DM Mono',monospace;
  color:var(--accent);
  cursor:pointer;
  display:flex;align-items:center;gap:5px;
}

/* ── NAV ──────────────────────────────────────────────────────────────────── */
.nav{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:var(--surface);
  border-top:1px solid var(--border);
  display:flex;
  padding-bottom:var(--safe-bot);
}
.nav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;
  gap:3px;padding:10px 0;
  border:none;background:none;color:var(--muted);
  font-family:'DM Sans',sans-serif;font-size:10px;font-weight:500;
  cursor:pointer;transition:color .15s;
}
.nav-btn.active{color:var(--accent)}
.nav-btn svg{width:22px;height:22px;stroke-width:1.8}

/* ── CONTENT ─────────────────────────────────────────────────────────────── */
.content{
  flex:1;
  padding:16px 16px calc(70px + var(--safe-bot));
  max-width:480px;
  margin:0 auto;
  width:100%;
}
.screen{display:none}
.screen.active{display:block}

/* ── CARDS ───────────────────────────────────────────────────────────────── */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--card-r);
  padding:16px;
  margin-bottom:12px;
}
.card-title{
  font-size:11px;font-weight:500;
  color:var(--muted);text-transform:uppercase;letter-spacing:.06em;
  margin-bottom:12px;
}
.metric-row{display:flex;gap:10px;margin-bottom:12px}
.metric{
  flex:1;background:var(--surface2);
  border-radius:12px;padding:12px;
  border:1px solid var(--border);
}
.metric-label{font-size:10px;color:var(--muted);margin-bottom:4px}
.metric-value{font-size:20px;font-weight:600;font-family:'DM Mono',monospace;letter-spacing:-1px}
.metric-value.green{color:var(--green)}
.metric-value.red{color:var(--red)}
.metric-value.amber{color:var(--amber)}
.metric-sub{font-size:10px;color:var(--muted);margin-top:2px}

/* ── PROGRESS BARS ───────────────────────────────────────────────────────── */
.cat-item{margin-bottom:14px}
.cat-item:last-child{margin-bottom:0}
.cat-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.cat-name{font-size:13px;font-weight:500}
.cat-values{font-size:11px;font-family:'DM Mono',monospace;color:var(--muted)}
.cat-values span{color:var(--text)}
.progress-track{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;transition:width .4s cubic-bezier(.4,0,.2,1)}
.progress-fill.ok{background:var(--green)}
.progress-fill.warn{background:var(--amber)}
.progress-fill.over{background:var(--red)}
.cat-status{font-size:10px;margin-top:3px;color:var(--muted)}

/* ── FORM ────────────────────────────────────────────────────────────────── */
.form-group{margin-bottom:14px}
.form-label{font-size:12px;color:var(--muted);margin-bottom:6px;display:block;font-weight:500}
.form-input,.form-select{
  width:100%;background:var(--surface2);
  border:1px solid var(--border);
  border-radius:10px;
  padding:12px 14px;
  color:var(--text);
  font-family:'DM Sans',sans-serif;
  font-size:15px;
  outline:none;
  transition:border-color .15s;
  -webkit-appearance:none;appearance:none;
}
.form-input:focus,.form-select:focus{border-color:var(--accent)}
.form-input::placeholder{color:var(--muted)}
.form-row{display:flex;gap:10px}
.form-row .form-group{flex:1}

.value-input-wrap{position:relative}
.value-prefix{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  color:var(--muted);font-size:14px;pointer-events:none;
}
.value-input-wrap .form-input{padding-left:36px;font-size:18px;font-weight:600;font-family:'DM Mono',monospace}

.btn-primary{
  width:100%;padding:15px;
  background:var(--accent);
  color:#fff;border:none;border-radius:12px;
  font-family:'DM Sans',sans-serif;font-size:16px;font-weight:600;
  cursor:pointer;transition:opacity .15s,transform .1s;
  margin-top:4px;
}
.btn-primary:active{transform:scale(.98);opacity:.9}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}

/* ── LANCAMENTOS LIST ────────────────────────────────────────────────────── */
.lanc-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 0;
  border-bottom:1px solid var(--border);
}
.lanc-item:last-child{border-bottom:none}
.lanc-icon{
  width:40px;height:40px;border-radius:10px;
  background:var(--surface2);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;
}
.lanc-info{flex:1;min-width:0}
.lanc-desc{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lanc-cat{font-size:11px;color:var(--muted);margin-top:1px}
.lanc-right{text-align:right;flex-shrink:0}
.lanc-value{font-size:14px;font-weight:600;font-family:'DM Mono',monospace;color:var(--red)}
.lanc-date{font-size:11px;color:var(--muted);margin-top:1px}

/* ── ORCAMENTO ───────────────────────────────────────────────────────────── */
.orc-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 0;border-bottom:1px solid var(--border);
}
.orc-row:last-child{border-bottom:none}
.orc-label{font-size:13px;color:var(--muted)}
.orc-value{font-size:14px;font-weight:600;font-family:'DM Mono',monospace}
.orc-row.total .orc-label{color:var(--text);font-weight:600}
.orc-row.total .orc-value{font-size:16px}

/* ── HISTORICO ───────────────────────────────────────────────────────────── */
.hist-month{
  background:var(--surface2);border-radius:12px;
  padding:14px;margin-bottom:10px;
  border:1px solid var(--border);
}
.hist-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.hist-label{font-size:14px;font-weight:600}
.hist-total{font-size:16px;font-weight:700;font-family:'DM Mono',monospace}
.hist-bar-wrap{height:4px;background:var(--surface);border-radius:2px;margin-bottom:10px;overflow:hidden}
.hist-bar{height:100%;border-radius:2px;transition:width .4s}
.hist-detail{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.hist-sobra{font-weight:600}

/* ── TOAST ───────────────────────────────────────────────────────────────── */
.toast{
  position:fixed;bottom:calc(70px + var(--safe-bot) + 12px);
  left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--surface2);border:1px solid var(--border);
  border-radius:10px;padding:10px 18px;
  font-size:13px;font-weight:500;
  opacity:0;transition:all .25s;pointer-events:none;
  white-space:nowrap;z-index:200;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{border-color:var(--green);color:var(--green)}
.toast.error{border-color:var(--red);color:var(--red)}

/* ── LOADING ─────────────────────────────────────────────────────────────── */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;gap:12px}
.spinner{width:28px;height:28px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:13px;color:var(--muted)}

/* ── EMPTY ───────────────────────────────────────────────────────────────── */
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty-icon{font-size:36px;margin-bottom:8px}
.empty-text{font-size:14px}

/* ── MONTH PICKER ────────────────────────────────────────────────────────── */
.modal-overlay{
  position:fixed;inset:0;z-index:300;
  background:rgba(0,0,0,.7);
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal-sheet{
  background:var(--surface);
  border-radius:20px 20px 0 0;
  padding:20px 20px calc(20px + var(--safe-bot));
  width:100%;max-width:480px;
  transform:translateY(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);
}
.modal-overlay.open .modal-sheet{transform:translateY(0)}
.modal-title{font-size:16px;font-weight:600;margin-bottom:16px;text-align:center}
.month-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.month-opt{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:10px;padding:10px;text-align:center;
  font-size:13px;font-family:'DM Mono',monospace;cursor:pointer;
  transition:all .15s;
}
.month-opt.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

/* ── DETAIL SCREEN ───────────────────────────────────────────────────────── */
.back-btn{
  display:flex;align-items:center;gap:8px;
  background:none;border:none;color:var(--accent);
  font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;
  cursor:pointer;padding:0;margin-bottom:16px;
}
.back-btn svg{width:18px;height:18px;stroke-width:2}
.detail-header{margin-bottom:16px}
.detail-month{font-size:22px;font-weight:700;margin-bottom:2px}
.detail-sub{font-size:13px;color:var(--muted)}

/* ── HIST EXPANDED ───────────────────────────────────────────────────────── */
.hist-month{cursor:pointer;transition:border-color .15s}
.hist-month:hover{border-color:var(--accent)}
.hist-expanded{margin-top:10px;border-top:1px solid var(--border);padding-top:10px}
.hist-exp-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:12px}
.hist-exp-label{color:var(--muted)}
.hist-exp-value{font-family:'DM Mono',monospace;font-size:12px;font-weight:500}
.hist-cats{margin-top:8px}
.hist-cat-row{display:flex;justify-content:space-between;align-items:center;padding:3px 0;font-size:12px;border-bottom:1px solid var(--border)}
.hist-cat-row:last-child{border-bottom:none}
.hist-cat-name{color:var(--muted);display:flex;align-items:center;gap:5px}
.hist-cat-val{font-family:'DM Mono',monospace;font-size:12px}
.hist-status-badge{
  display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;margin-top:6px;
}
.badge-ok{background:rgba(34,197,94,.15);color:var(--green)}
.badge-warn{background:rgba(245,158,11,.15);color:var(--amber)}
.badge-over{background:rgba(239,68,68,.15);color:var(--red)}
.badge-empty{background:var(--surface2);color:var(--muted)}

/* ── SECTION HEADER ─────────────────────────────────────────────────────── */
.section-header{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:10px;
}
.section-title{font-size:13px;font-weight:600;color:var(--text)}
.section-count{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace}

/* ── REFRESH BTN ─────────────────────────────────────────────────────────── */
.refresh-btn{
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:8px;
  padding:6px 8px;
  color:var(--muted);
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.refresh-btn:hover{color:var(--accent);border-color:var(--accent)}
.refresh-btn:active{transform:scale(.92)}
.refresh-btn.spinning svg{animation:spin .7s linear infinite}

/* ── DELETE BTN ──────────────────────────────────────────────────────────── */
.lanc-delete{
  background:none;border:none;color:var(--muted);cursor:pointer;
  padding:6px;border-radius:8px;transition:all .15s;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.lanc-delete:hover{color:var(--red);background:rgba(239,68,68,.1)}
.lanc-delete svg{width:16px;height:16px;stroke-width:1.8}

/* ── CLEAR MONTH BTN ─────────────────────────────────────────────────────── */
.clear-month-btn{
  width:100%;margin-top:12px;padding:9px;
  background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);
  border-radius:10px;color:var(--red);
  font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;
  cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:6px;
}
.clear-month-btn:hover{background:rgba(239,68,68,.15)}

/* ── ORC ROW ACTIONS (editar/excluir categorias, contas fixas, renda) ──────── */
.orc-row-actions{display:flex;align-items:center;gap:2px;flex-shrink:0}
.orc-action-btn{
  background:none;border:none;color:var(--muted);cursor:pointer;
  padding:5px;border-radius:8px;transition:all .15s;
  display:flex;align-items:center;justify-content:center;
}
.orc-action-btn:hover{color:var(--accent);background:rgba(79,142,247,.1)}
.orc-action-btn.danger:hover{color:var(--red);background:rgba(239,68,68,.1)}
.orc-action-btn svg{width:14px;height:14px;stroke-width:1.8}
.add-row-btn{
  width:100%;margin-top:10px;padding:9px;
  background:rgba(79,142,247,.08);border:1px solid rgba(79,142,247,.25);
  border-radius:10px;color:var(--accent);
  font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;
  cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:6px;
}
.add-row-btn:hover{background:rgba(79,142,247,.15)}

/* ── PARCEL FIELD ────────────────────────────────────────────────────────── */
.parcel-info{
  background:rgba(79,142,247,.08);border:1px solid rgba(79,142,247,.2);
  border-radius:10px;padding:10px 12px;font-size:12px;color:var(--accent);
  margin-top:-6px;margin-bottom:14px;
}

/* ── CONFIRM MODAL ───────────────────────────────────────────────────────── */
.confirm-modal{
  position:fixed;inset:0;z-index:400;
  background:rgba(0,0,0,.8);
  display:flex;align-items:center;justify-content:center;padding:20px;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.confirm-modal.open{opacity:1;pointer-events:all}
.confirm-box{
  background:var(--surface);border:1px solid var(--border);
  border-radius:16px;padding:24px;width:100%;max-width:320px;
}
.confirm-title{font-size:16px;font-weight:600;margin-bottom:8px}
.confirm-text{font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.5}
.confirm-btns{display:flex;gap:10px}
.confirm-cancel{flex:1;padding:11px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;cursor:pointer;}
.confirm-ok{flex:1;padding:11px;background:var(--red);border:none;border-radius:10px;color:#fff;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;}

/* ── DIVIDER ─────────────────────────────────────────────────────────────── */
.divider{height:1px;background:var(--border);margin:16px 0}

/* ── FILTER BAR ──────────────────────────────────────────────────────────── */
.filter-bar{
  display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;
  margin-bottom:12px;scrollbar-width:none;
}
.filter-bar::-webkit-scrollbar{display:none}
.filter-chip{
  flex-shrink:0;padding:6px 12px;border-radius:20px;
  border:1px solid var(--border);background:var(--surface2);
  color:var(--muted);font-size:12px;font-weight:500;cursor:pointer;
  white-space:nowrap;transition:all .15s;font-family:'DM Sans',sans-serif;
}
.filter-chip.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* ── EDIT MODAL ───────────────────────────────────────────────────────────── */
.edit-modal-overlay{
  position:fixed;inset:0;z-index:300;
  background:rgba(0,0,0,.75);
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.edit-modal-overlay.open{opacity:1;pointer-events:all}
.edit-modal-sheet{
  background:var(--surface);
  border-radius:20px 20px 0 0;
  padding:20px 20px calc(20px + var(--safe-bot));
  width:100%;max-width:480px;
  transform:translateY(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);
}
.edit-modal-overlay.open .edit-modal-sheet{transform:translateY(0)}
.edit-modal-title{font-size:16px;font-weight:600;margin-bottom:16px}
.edit-save-btn{
  width:100%;padding:14px;background:var(--accent);color:#fff;
  border:none;border-radius:12px;font-family:'DM Sans',sans-serif;
  font-size:15px;font-weight:600;cursor:pointer;margin-top:8px;
}

/* ── DETAIL SCREEN ───────────────────────────────────────────────────────── */
.detail-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--card-r);overflow:hidden;margin-bottom:12px;
}
.detail-hero{
  padding:24px 20px;text-align:center;
  border-bottom:1px solid var(--border);
}
.detail-hero-icon{font-size:44px;margin-bottom:8px}
.detail-hero-desc{font-size:18px;font-weight:600;margin-bottom:4px}
.detail-hero-cat{font-size:13px;color:var(--muted)}
.detail-hero-value{font-size:28px;font-weight:700;font-family:'DM Mono',monospace;margin-top:10px}
.detail-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:13px 20px;border-bottom:1px solid var(--border);
}
.detail-row:last-child{border-bottom:none}
.detail-row-label{font-size:13px;color:var(--muted)}
.detail-row-value{font-size:14px;font-weight:500}
.detail-edit-btn{
  width:100%;padding:14px;
  background:var(--surface2);border:1px solid var(--border);
  border-radius:12px;color:var(--text);
  font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
  margin-bottom:10px;
}
.detail-delete-btn{
  width:100%;padding:14px;
  background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);
  border-radius:12px;color:var(--red);
  font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
}

/* ── SUMMARY PILL ────────────────────────────────────────────────────────── */
.summary-pill{
  display:inline-flex;align-items:center;gap:5px;
  background:var(--surface2);border:1px solid var(--border);
  border-radius:20px;padding:4px 10px;font-size:11px;
  font-family:'DM Mono',monospace;
}
.summary-pill.green{border-color:var(--green);color:var(--green);background:rgba(34,197,94,.08)}
.summary-pill.red{border-color:var(--red);color:var(--red);background:rgba(239,68,68,.08)}
.summary-pill.amber{border-color:var(--amber);color:var(--amber);background:rgba(245,158,11,.08)}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div>
    <div class="topbar-title">Lazzarini 💳</div>
    <div class="topbar-sub">Controle de gastos</div>
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <button class="month-badge" onclick="openMonthPicker()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" width="14" height="14"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      <span id="topbar-month">jun/26</span>
    </button>
    <button class="refresh-btn" id="refresh-btn" onclick="refreshData()" title="Atualizar dados">

<script>
// ── STATE ──────────────────────────────────────────────────────────────────
const MONTHS = [
  {label:'jun/26', date:new Date(2026,5,1)},
  {label:'jul/26', date:new Date(2026,6,1)},
  {label:'ago/26', date:new Date(2026,7,1)},
  {label:'set/26', date:new Date(2026,8,1)},
  {label:'out/26', date:new Date(2026,9,1)},
  {label:'nov/26', date:new Date(2026,10,1)},
  {label:'dez/26', date:new Date(2026,11,1)},
  {label:'jan/27', date:new Date(2027,0,1)},
  {label:'fev/27', date:new Date(2027,1,1)},
  {label:'mar/27', date:new Date(2027,2,1)},
  {label:'abr/27', date:new Date(2027,3,1)},
  {label:'mai/27', date:new Date(2027,4,1)},
  {label:'jun/27', date:new Date(2027,5,1)},
];

let TETOS = {
  'Alimentacao fora':        2000,
  'Mercado / Supermercado':  1800,
  'Farmacia / Saude':         800,
  'Veiculos / Transporte':   1400,
  'Viagem / Lazer':          1000,
  'Vestuario / Moda':        1000,
  'Mercado Livre':            600,
  'Streaming / Assinaturas':  370,
  'Educacao / Infanto':       180,
  'Pet':                      450,
  'Decoracao Casa':           800,
  'Guitarra':                 300,
  'Presentes':                800,
  'Outros / Diversos':        500,
};

let CONTAS_FIXAS = [
  { nome: 'Financiamento imóvel', valor: 7500, icone: '🏠' },
  { nome: 'Escola (filha)',       valor: 2300, icone: '🏫' },
  { nome: 'Convênio médico',      valor: 2000, icone: '🏥' },
  { nome: 'Condomínio',           valor: 1600, icone: '🏢' },
  { nome: 'Terapia',              valor: 510,  icone: '🧠' },
  { nome: 'Claro',                valor: 281,  icone: '📱' },
  { nome: 'Vivo',                 valor: 124,  icone: '📱' },
  { nome: 'Seguro carro',         valor: 244,  icone: '🚗' },
];

const CAT_ICONS = {
  'Alimentacao fora':'🍽','Mercado / Supermercado':'🛒',
  'Farmacia / Saude':'💊','Veiculos / Transporte':'🚗',
  'Viagem / Lazer':'✈','Vestuario / Moda':'🛍',
  'Mercado Livre':'📦','Streaming / Assinaturas':'📺',
  'Educacao / Infanto':'📚','Pet':'🐾',
  'Decoracao Casa':'🏠','Guitarra':'🎸',
  'Presentes':'🎁','Outros / Diversos':'🎯',
};

let CATEGORIAS = []; // [{id, nome, teto}] — usado na tela de Orçamento (CRUD)

let currentMonth = MONTHS[0];
let allLancamentos = [];
let config = {
  renda_guilherme: 20000,
  renda_esposa: 14000,
  meta_fatura: 12000,
  total_fixos: 14559,
};

// ── API ────────────────────────────────────────────────────────────────────
async function apiFetch(url, options) {
  const r = await fetch(url, options);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.error || 'Erro na requisição');
  return body;
}

// ── INIT ───────────────────────────────────────────────────────────────────
async function init() {
  setTodayDate();
  buildMonthGrid();
  await loadData();
  renderPainel();
}

function setTodayDate() {
  const today = new Date();
  document.getElementById('f-data').value = today.toISOString().split('T')[0];
}

async function loadData() {
  try {
    const cfg = await apiFetch('/api/config');
    config.renda_guilherme = cfg.renda_guilherme;
    config.renda_esposa    = cfg.renda_esposa;
    config.meta_fatura     = cfg.meta_fatura;
    config.total_fixos     = cfg.total_fixos;
    if (cfg.tetos && Object.keys(cfg.tetos).length) TETOS = cfg.tetos;
    if (cfg.contas_fixas && cfg.contas_fixas.length) CONTAS_FIXAS = cfg.contas_fixas;
    populateCategoriaSelects();
  } catch(e) { console.error(e); /* mantém defaults locais */ }

  try {
    CATEGORIAS = await apiFetch('/api/categorias');
  } catch(e) { console.error(e); /* mantém CATEGORIAS vazio, tela de orçamento mostra vazio */ }

  try {
    const rows = await apiFetch('/api/lancamentos');
    allLancamentos = rows.map(item => ({
      id: item.id,
      data: parseDate(item.data),
      descricao: item.descricao || '',
      categoria: item.categoria || '',
      valor: parseFloat(item.valor),
      observacao: item.observacao || '',
      tipo: item.tipo || 'A vista',
      raw: item.data,
    }));
    allLancamentos.sort((a,b) => b.data - a.data);
    allLancamentos.forEach((item, i) => item._idx = i);
  } catch(e) {
    console.error(e);
    allLancamentos = [];
  }
}

// Preenche os <select> de categoria (Lançar + Modal de Edição) a partir de TETOS,
// que já vem dinâmico de GET /api/config (tabela categorias).
function populateCategoriaSelects() {
  const nomes = Object.keys(TETOS).sort((a,b) => a.localeCompare(b));
  const optionsHtml = nomes.map(n => `<option>${n}</option>`).join('');

  const fSel = document.getElementById('f-categoria');
  const valorAtualF = fSel.value;
  fSel.innerHTML = `<option value="">Selecione...</option>${optionsHtml}`;
  if (nomes.includes(valorAtualF)) fSel.value = valorAtualF;

  const editSel = document.getElementById('edit-categoria');
  const valorAtualEdit = editSel.value;
  editSel.innerHTML = optionsHtml;
  if (nomes.includes(valorAtualEdit)) editSel.value = valorAtualEdit;
}

function parseDate(str) {
  if (!str) return new Date();
  // Handles DD/MM/YYYY or YYYY-MM-DD
  if (str.includes('/')) {
    const [d,m,y] = str.split('/');
    return new Date(y, m-1, d);
  }
  return new Date(str);
}

function formatDate(d) {
  if (!d) return '';
  const date = d instanceof Date ? d : new Date(d);
  return date.toLocaleDateString('pt-BR');
}

function formatMoney(v) {
  return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0);
}

// ── FILTER ────────────────────────────────────────────────────────────────
function getLancamentosDoMes(month) {
  return allLancamentos.filter(l => {
    if (!l.data) return false;
    return l.data.getMonth() === month.date.getMonth() &&
           l.data.getFullYear() === month.date.getFullYear();
  });
}

function getTotaisPorCategoria(lancamentos) {
  const totais = {};
  Object.keys(TETOS).forEach(k => totais[k] = 0);
  lancamentos.forEach(l => {
    if (totais[l.categoria] !== undefined) totais[l.categoria] += l.valor;
    else if (l.categoria) totais[l.categoria] = (totais[l.categoria]||0) + l.valor;
  });
  return totais;
}

// ── RENDER PAINEL ─────────────────────────────────────────────────────────
function renderPainel() {
  const lancs = getLancamentosDoMes(currentMonth);
  const totais = getTotaisPorCategoria(lancs);
  const totalFatura = Object.values(totais).reduce((a,b)=>a+b,0);
  const meta = config.meta_fatura || 12000;
  const pctFatura = Math.min(totalFatura / meta, 1);
  const diff = meta - totalFatura;

  const pctClass = pctFatura < 0.75 ? 'green' : pctFatura < 1 ? 'amber' : 'red';
  const diffClass = diff >= 0 ? 'green' : 'red';

  let html = `
    <div class="metric-row">
      <div class="metric">
        <div class="metric-label">Gasto no mês</div>
        <div class="metric-value ${pctClass}">${formatMoney(totalFatura)}</div>
        <div class="metric-sub">${(pctFatura*100).toFixed(0)}% da meta</div>
      </div>
      <div class="metric">
        <div class="metric-label">${diff>=0?'Disponível':'Acima da meta'}</div>
        <div class="metric-value ${diffClass}">${formatMoney(Math.abs(diff))}</div>
        <div class="metric-sub">meta ${formatMoney(meta)}</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Por categoria</div>`;

  Object.entries(TETOS).forEach(([cat, teto]) => {
    const gasto = totais[cat] || 0;
    const pct = teto > 0 ? Math.min(gasto/teto, 1.2) : 0;
    const pctShow = teto > 0 ? Math.min(gasto/teto*100, 100) : 0;
    const cls = pct > 1 ? 'over' : pct >= 0.75 ? 'warn' : 'ok';
    const icon = CAT_ICONS[cat] || '💳';
    const statusTxt = gasto===0 ? '' : pct>1 ? '<span style="font-size:10px;color:var(--red)">🔴 Estourou</span>' : pct>=0.75 ? '<span style="font-size:10px;color:var(--amber)">🟡 Atenção</span>' : '<span style="font-size:10px;color:var(--green)">✅ OK</span>';
    html += `
      <div class="cat-item">
        <div class="cat-header">
          <div class="cat-name">${icon} ${cat}</div>
          <div class="cat-values"><span>${formatMoney(gasto)}</span> / ${formatMoney(teto)}</div>
        </div>
        <div class="progress-track">
          <div class="progress-fill ${cls}" style="width:${pctShow}%"></div>
        </div>
        ${statusTxt}
      </div>`;
  });

  html += `</div>`;

  // Recent lancamentos
  if (lancs.length > 0) {
    html += `<div class="card">
      <div class="section-header">
        <div class="section-title">Últimos lançamentos</div>
        <div class="section-count">${lancs.length} no mês</div>
      </div>`;
    lancs.slice(0,5).forEach(l => {
      html += renderLancItem(l);
    });
    if (lancs.length > 5) {
      html += `<div style="text-align:center;padding-top:10px">
        <button onclick="goToFromBtn('lancamentos')" style="background:none;border:none;color:var(--accent);font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif">Ver todos (${lancs.length}) →</button>
      </div>`;
    }
    html += `</div>`;
  }

  document.getElementById('painel-content').innerHTML = html;
}

// ── CLICKABLE LANC ITEM (for lancamentos screen) ──────────────────────────
function renderLancItemClickable(l) {
  const icon  = CAT_ICONS[l.categoria] || '💳';
  const color = getCatColor(l.categoria);
  return `<div class="lanc-item" onclick="openDetalhe(${l._idx})" style="cursor:pointer">
    <div class="lanc-icon">${icon}</div>
    <div class="lanc-info">
      <div class="lanc-desc">${l.descricao || l.categoria}</div>
      <div class="lanc-cat">${l.categoria}${l.observacao ? ' · '+l.observacao : ''}</div>
    </div>
    <div class="lanc-right">
      <div class="lanc-value" style="color:${color}">-${formatMoney(l.valor)}</div>
      <div class="lanc-date">${formatDate(l.data)}</div>
    </div>
    <button class="lanc-delete" onclick="event.stopPropagation();confirmDeleteLanc(${l._idx})" title="Excluir">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
    </button>
  </div>`;
}

// ── DETALHE LANÇAMENTO ─────────────────────────────────────────────────────
function openDetalhe(idx) {
  const l = allLancamentos[idx];
  if (!l) return;
  const icon  = CAT_ICONS[l.categoria] || '💳';
  const color = getCatColor(l.categoria);

  const html = `
    <button class="back-btn" onclick="goToFromBtn('lancamentos')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      Voltar
    </button>
    <div class="detail-card">
      <div class="detail-hero">
        <div class="detail-hero-icon">${icon}</div>
        <div class="detail-hero-desc">${l.descricao || '(sem descrição)'}</div>
        <div class="detail-hero-cat">${l.categoria}</div>
        <div class="detail-hero-value" style="color:${color}">-${formatMoney(l.valor)}</div>
      </div>
      <div class="detail-row">
        <span class="detail-row-label">📅 Data</span>
        <span class="detail-row-value">${formatDate(l.data)}</span>
      </div>
      <div class="detail-row">
        <span class="detail-row-label">💳 Tipo</span>
        <span class="detail-row-value">${l.tipo || 'A vista'}</span>
      </div>
      ${l.observacao ? `<div class="detail-row">
        <span class="detail-row-label">📝 Observação</span>
        <span class="detail-row-value">${l.observacao}</span>
      </div>` : ''}

    </div>
    <button class="detail-edit-btn" onclick="openEditModal(${idx})">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" width="16" height="16" stroke-width="2">
        <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
        <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
      </svg>
      Editar lançamento
    </button>
    <button class="detail-delete-btn" onclick="confirmDeleteLanc(${idx})">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" width="16" height="16" stroke-width="2">
        <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
      </svg>
      Excluir lançamento
    </button>`;

  document.getElementById('detalhe-lanc-content').innerHTML = html;
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-detalhe-lanc').classList.add('active');
  window.scrollTo(0,0);
}

// ── EDIT MODAL ─────────────────────────────────────────────────────────────
let editingIdx = null;

function openEditModal(idx) {
  const l = allLancamentos[idx];
  if (!l) return;
  editingIdx = idx;
  document.getElementById('edit-descricao').value  = l.descricao || '';
  document.getElementById('edit-categoria').value  = l.categoria || '';
  document.getElementById('edit-valor').value      = l.valor;
  document.getElementById('edit-tipo').value       = l.tipo || 'A vista';
  document.getElementById('edit-obs').value        = l.observacao || '';
  // Convert date to YYYY-MM-DD for input
  const d = l.data;
  const ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  document.getElementById('edit-data').value = ds;
  document.getElementById('edit-modal').classList.add('open');
}

function closeEditModal(e) {
  if (!e || e.target === document.getElementById('edit-modal')) {
    document.getElementById('edit-modal').classList.remove('open');
    editingIdx = null;
  }
}

async function saveEdit() {
  if (editingIdx === null) return;
  const l = allLancamentos[editingIdx];
  if (!l) return;

  const newDesc  = document.getElementById('edit-descricao').value.trim();
  const newCat   = document.getElementById('edit-categoria').value;
  const newValor = parseFloat(document.getElementById('edit-valor').value);
  const newTipo  = document.getElementById('edit-tipo').value;
  const newDataRaw = document.getElementById('edit-data').value;
  if (!newDataRaw || !newCat || !newValor) { showToast('Preencha todos os campos', 'error'); return; }

  const [y,m,d] = newDataRaw.split('-');
  const newDataFmt = `${d}/${m}/${y}`;
  const newObs = document.getElementById('edit-obs').value.trim();

  const btn = document.querySelector('.edit-save-btn');
  btn.disabled = true; btn.textContent = 'Salvando...';

  try {
    await apiFetch(`/api/lancamentos/${l.id}`, {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        data: newDataFmt, descricao: newDesc,
        categoria: newCat, valor: newValor,
        observacao: newObs, tipo: newTipo,
      }),
    });

    await loadData();
    closeEditModal();
    showToast('Lançamento atualizado ✓', 'success');
    // Refresh detalhe screen with new idx
    const newIdx = allLancamentos.findIndex(x => x.id === l.id);
    if (newIdx >= 0) openDetalhe(newIdx);
    renderPainel();
  } catch(e) {
    showToast('Erro ao salvar: ' + e.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'Salvar alterações';
  }
}

function getCatColor(categoria, lancamentos) {
  // Get total for this category in the current month's lancamentos context
  const lancsDoMes = getLancamentosDoMes(currentMonth);
  const totais = getTotaisPorCategoria(lancsDoMes);
  const gasto = totais[categoria] || 0;
  const teto  = TETOS[categoria]  || 0;
  if (teto === 0 || gasto === 0) return 'var(--muted)';
  const pct = gasto / teto;
  if (pct > 1)    return 'var(--red)';
  if (pct >= 0.75) return 'var(--amber)';
  return 'var(--green)';
}

function renderLancItem(l, showDelete=false) {
  const icon  = CAT_ICONS[l.categoria] || '💳';
  const color = getCatColor(l.categoria);
  const deleteBtn = showDelete ? `
    <button class="lanc-delete" onclick="confirmDeleteLanc(${l._idx})" title="Excluir">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
    </button>` : '';
  return `<div class="lanc-item">
    <div class="lanc-icon">${icon}</div>
    <div class="lanc-info">
      <div class="lanc-desc">${l.descricao || l.categoria}</div>
      <div class="lanc-cat">${l.categoria}${l.observacao ? ' · '+l.observacao : ''}</div>
    </div>
    <div class="lanc-right">
      <div class="lanc-value" style="color:${color}">-${formatMoney(l.valor)}</div>
      <div class="lanc-date">${formatDate(l.data)}</div>
    </div>
    ${deleteBtn}
  </div>`;
}

// ── RENDER LANCAMENTOS ────────────────────────────────────────────────────
let activeFilter = 'Todos';

function setFilter(cat) {
  activeFilter = cat;
  renderLancamentos();
}

function renderLancamentos() {
  const lancs = getLancamentosDoMes(currentMonth);
  const total = lancs.reduce((a,l)=>a+l.valor,0);
  const metaL = config.meta_fatura || 12000;
  const pctL  = total / metaL;
  const totalColor = pctL > 1 ? 'red' : pctL >= 0.75 ? 'amber' : 'green';

  // Build filter chips from categories that have entries
  const usedCats = ['Todos', ...Object.keys(TETOS).filter(cat => lancs.some(l => l.categoria === cat))];
  // Also add any category not in TETOS
  lancs.forEach(l => { if (l.categoria && !usedCats.includes(l.categoria)) usedCats.push(l.categoria); });

  let html = '';
  if (lancs.length === 0) {
    html = `<div class="empty"><div class="empty-icon">📋</div><div class="empty-text">Nenhum lançamento em ${currentMonth.label}</div></div>`;
  } else {
    html += `<div class="metric-row"><div class="metric">
      <div class="metric-label">Total lançado</div>
      <div class="metric-value ${totalColor}">${formatMoney(total)}</div>
      <div class="metric-sub">${lancs.length} lançamento${lancs.length!==1?'s':''}</div>
    </div></div>`;

    // Filter bar
    html += `<div class="filter-bar">`;
    usedCats.forEach(cat => {
      const icon = cat === 'Todos' ? '' : (CAT_ICONS[cat]||'') + ' ';
      html += `<div class="filter-chip ${cat===activeFilter?'active':''}" onclick="setFilter('${cat}')">${icon}${cat}</div>`;
    });
    html += `</div>`;

    const filtered = activeFilter === 'Todos' ? lancs : lancs.filter(l => l.categoria === activeFilter);
    if (filtered.length === 0) {
      html += `<div class="empty"><div class="empty-icon">🔍</div><div class="empty-text">Nenhum lançamento nesta categoria</div></div>`;
    } else {
      html += `<div class="card">`;
      filtered.forEach(l => { html += renderLancItemClickable(l); });
      html += `</div>`;
    }
  }
  document.getElementById('lancamentos-content').innerHTML = html;
}

      </div>
      <div class="orc-row">
        <div class="orc-label">💼 Esposa (PJ líquido)</div>

        <div class="orc-label">Renda total</div>
        <div class="orc-value">${formatMoney(renda)}</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Contas fixas</div>
      ${CONTAS_FIXAS.map(c => `<div class="orc-row">
        <div class="orc-label">${c.icone || '💰'} ${c.nome}</div>
        <div class="orc-row-actions">
          <div class="orc-value">${formatMoney(c.valor)}</div>

      ${CATEGORIAS.map(c => `<div class="orc-row">
        <div class="orc-label">${CAT_ICONS[c.nome] || '💳'} ${c.nome}</div>
        <div class="orc-row-actions">
          <div class="orc-value">${formatMoney(c.teto)}</div>
          <button class="orc-action-btn" onclick="openCategoriaModal('${c.id}')" title="Editar">${editIconSvg()}</button>

// ── FORM MODAL (renda / conta fixa / categoria) ────────────────────────────
let formModalOnSave = null;

function openFormModal(title, fields, onSave) {
  document.getElementById('form-modal-title').textContent = title;
  fields.forEach((f, i) => {
    const idx = i + 1;
    const group = document.getElementById(`form-modal-group-${idx}`);
    const label = document.getElementById(`form-modal-label-${idx}`);
    const input = document.getElementById(`form-modal-input-${idx}`);
    group.style.display = '';
    label.textContent = f.label;
    input.type = f.type === 'money' ? 'number' : 'text';
    input.step = f.type === 'money' ? '0.01' : '';
    input.min = f.type === 'money' ? '0' : '';
    input.value = f.value === undefined || f.value === null ? '' : f.value;
    input.dataset.key = f.key;
  });
  for (let i = fields.length + 1; i <= 2; i++) {
    document.getElementById(`form-modal-group-${i}`).style.display = 'none';
  }
  formModalOnSave = onSave;
  document.getElementById('form-modal').classList.add('open');
}

function closeFormModal(e) {
  if (!e || e.target === document.getElementById('form-modal')) {
    document.getElementById('form-modal').classList.remove('open');
    formModalOnSave = null;
  }
}

async function formModalSave() {
  if (!formModalOnSave) return;
  const values = {};
  for (let i = 1; i <= 2; i++) {
    const group = document.getElementById(`form-modal-group-${i}`);
    if (group.style.display === 'none') continue;
    const input = document.getElementById(`form-modal-input-${i}`);
    values[input.dataset.key] = input.value;
  }
  const btn = document.querySelector('#form-modal .edit-save-btn');
  btn.disabled = true; btn.textContent = 'Salvando...';
  try {
    await formModalOnSave(values);
    closeFormModal();
  } catch (e) {
    showToast('Erro: ' + e.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'Salvar';
  }
}

// ── EDITAR RENDA ────────────────────────────────────────────────────────────
function openEditRenda() {
  openFormModal('Editar renda', [
    { key: 'renda_guilherme', label: 'Guilherme (PJ líquido)', type: 'money', value: config.renda_guilherme },
    { key: 'renda_esposa',    label: 'Esposa (PJ líquido)',    type: 'money', value: config.renda_esposa },
  ], async (v) => {
    const rg = parseFloat(v.renda_guilherme);
    const re = parseFloat(v.renda_esposa);
    if (isNaN(rg) || rg < 0 || isNaN(re) || re < 0) throw new Error('Informe valores válidos');
    await apiFetch('/api/config', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ renda_guilherme: rg, renda_esposa: re }),
    });
    await loadData();
    renderOrcamento();
    showToast('Renda atualizada ✓', 'success');
  });
}

// ── CRUD CONTAS FIXAS ───────────────────────────────────────────────────────
function openContaFixaModal(id) {
  const cf = id ? CONTAS_FIXAS.find(c => c.id === id) : null;
  openFormModal(cf ? 'Editar conta fixa' : 'Nova conta fixa', [
    { key: 'nome',  label: 'Nome',  type: 'text',  value: cf ? cf.nome : '' },
    { key: 'valor', label: 'Valor', type: 'money', value: cf ? cf.valor : '' },
  ], async (v) => {
    const nome = (v.nome || '').trim();
    const valor = parseFloat(v.valor);
    if (!nome) throw new Error('Informe o nome');
    if (isNaN(valor) || valor < 0) throw new Error('Valor inválido');
    if (cf) {
      await apiFetch(`/api/contas-fixas/${cf.id}`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nome, valor }),
      });
    } else {
      await apiFetch('/api/contas-fixas', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nome, valor }),
      });
    }
    await loadData();
    renderOrcamento();
    showToast(cf ? 'Conta fixa atualizada ✓' : 'Conta fixa criada ✓', 'success');
  });
}

function confirmDeleteContaFixa(id) {
  const cf = CONTAS_FIXAS.find(c => c.id === id);
  if (!cf) return;
  showConfirm('Excluir conta fixa', `Excluir "${cf.nome}"?`, async () => {
    try {
      await apiFetch(`/api/contas-fixas/${id}`, { method: 'DELETE' });
      await loadData();
      renderOrcamento();
      showToast('Conta fixa excluída ✓', 'success');
    } catch (e) {
      showToast('Erro ao excluir: ' + e.message, 'error');
    }
  });
}

// ── CRUD CATEGORIAS / TETOS ─────────────────────────────────────────────────
function openCategoriaModal(id) {
  const cat = id ? CATEGORIAS.find(c => c.id === id) : null;
  openFormModal(cat ? 'Editar categoria' : 'Nova categoria', [
    { key: 'nome', label: 'Nome',          type: 'text',  value: cat ? cat.nome : '' },
    { key: 'teto', label: 'Teto mensal',   type: 'money', value: cat ? cat.teto : '' },
  ], async (v) => {
    const nome = (v.nome || '').trim();
    const teto = parseFloat(v.teto);
    if (!nome) throw new Error('Informe o nome');
    if (isNaN(teto) || teto < 0) throw new Error('Teto inválido');
    let msg = cat ? 'Categoria atualizada ✓' : 'Categoria criada ✓';
    if (cat) {
      const result = await apiFetch(`/api/categorias/${cat.id}`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nome, teto }),
      });
      if (result.lancamentos_atualizados > 0) {
        msg = `Categoria renomeada — ${result.lancamentos_atualizados} lançamento(s) do histórico atualizado(s) ✓`;
      }
    } else {
      await apiFetch('/api/categorias', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nome, teto }),
      });
    }
    await loadData();
    renderOrcamento();
    showToast(msg, 'success');
  });
}

function confirmDeleteCategoria(id) {
  const cat = CATEGORIAS.find(c => c.id === id);
  if (!cat) return;
  showConfirm('Excluir categoria', `Excluir "${cat.nome}"?`, async () => {
    try {
      await apiFetch(`/api/categorias/${id}`, { method: 'DELETE' });
      await loadData();
      renderOrcamento();
      showToast('Categoria excluída ✓', 'success');
    } catch (e) {
      showToast(e.message, 'error');
    }
  });
}

// ── RENDER HISTORICO ──────────────────────────────────────────────────────
function renderHistorico() {
  const renda = (config.renda_guilherme||20000) + (config.renda_esposa||14000);
  const fixos = config.total_fixos || 14559;
  const meta  = config.meta_fatura || 12000;

  let html = '';
  const monthsWithData = MONTHS.filter(m => {
    return getLancamentosDoMes(m).length > 0 || m.label === currentMonth.label;
  });

  if (monthsWithData.length === 0) {
    html = `<div class="empty"><div class="empty-icon">📅</div><div class="empty-text">Nenhum dado ainda. Comece lançando suas compras!</div></div>`;
  } else {
    monthsWithData.forEach(m => {
      const lancs  = getLancamentosDoMes(m);
      const totais = getTotaisPorCategoria(lancs);
      const total  = Object.values(totais).reduce((a,b)=>a+b,0);
      const sobra  = renda - fixos - total;
      const pctSobra = renda > 0 ? sobra/renda : 0;
      const pct    = meta > 0 ? Math.min(total/meta,1.5) : 0;
      const barPct = Math.min(pct*100, 100);
      const isCurrent = m.label === currentMonth.label;

      const faturaCor = pct > 1 ? 'var(--red)' : pct >= 0.75 ? 'var(--amber)' : 'var(--green)';
      const sobraCor  = sobra >= 0 ? 'var(--green)' : 'var(--red)';
      const sobraBarCor = sobra >= 0 ? 'var(--green)' : 'var(--red)';

      let statusBadge = '';
      if (lancs.length === 0) statusBadge = '<span class="hist-status-badge badge-empty">Sem dados</span>';
      else if (pct > 1)       statusBadge = '<span class="hist-status-badge badge-over">Acima da meta</span>';
      else if (pct >= 0.75)   statusBadge = '<span class="hist-status-badge badge-warn">Atenção</span>';
      else                    statusBadge = '<span class="hist-status-badge badge-ok">Dentro da meta</span>';

      // Category rows (only those with value > 0)
      const catRows = Object.entries(totais)
        .filter(([,v]) => v > 0)
        .map(([cat,v]) => {
          const teto = TETOS[cat] || 0;
          const cp = teto > 0 ? v/teto : 0;
          const cc = cp > 1 ? 'var(--red)' : cp >= 0.75 ? 'var(--amber)' : 'var(--green)';
          return `<div class="hist-cat-row">
            <span class="hist-cat-name">${CAT_ICONS[cat]||'💳'} ${cat}</span>
            <span class="hist-cat-val" style="color:${cc}">${formatMoney(v)} <span style="color:var(--muted);font-size:10px">/ ${formatMoney(teto)}</span></span>
          </div>`;
        }).join('');

      html += `<div class="hist-month" style="${isCurrent?'border-color:var(--accent)':''}">
        <div class="hist-header">
          <div class="hist-label">${m.label}${isCurrent?' <span style="font-size:10px;color:var(--accent);font-weight:400">atual</span>':''}</div>
          <div style="display:flex;align-items:center;gap:8px">
            <div class="hist-total" style="color:${faturaCor}">${formatMoney(total)}</div>
            ${statusBadge}
          </div>
        </div>
        <div class="hist-bar-wrap">
          <div class="hist-bar" style="width:${barPct}%;background:${faturaCor}"></div>
        </div>

        <div class="hist-expanded">
          <div class="hist-exp-row">
            <span class="hist-exp-label">🎯 Meta fatura</span>
            <span class="hist-exp-value" style="color:var(--accent)">${formatMoney(meta)}</span>
          </div>
          <div class="hist-exp-row">
            <span class="hist-exp-label">🏠 Total fixos</span>
            <span class="hist-exp-value">${formatMoney(fixos)}</span>
          </div>
          <div class="hist-exp-row">
            <span class="hist-exp-label">💼 Renda familiar</span>
            <span class="hist-exp-value">${formatMoney(renda)}</span>
          </div>
          <div class="hist-exp-row" style="border-top:1px solid var(--border);margin-top:4px;padding-top:8px">
            <span class="hist-exp-label" style="font-weight:600;color:var(--text)">💰 Sobra / Poupança</span>
            <span class="hist-exp-value" style="color:${sobraCor};font-size:14px">${sobra>=0?'+':''}${formatMoney(sobra)} <span style="font-size:10px;opacity:.7">${(pctSobra*100).toFixed(1)}%</span></span>
          </div>
          ${catRows.length ? `<div class="hist-cats" style="margin-top:10px">
            <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">Por categoria</div>
            ${catRows}
          </div>` : ''}
          <button class="clear-month-btn" onclick="confirmClearMonth('${m.label}')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" width="14" height="14" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>
            Limpar todos os lançamentos de ${m.label}
          </button>
        </div>
      </div>`;
    });
  }

  document.getElementById('historico-content').innerHTML = html;
}

// ── SALVAR LANÇAMENTO ─────────────────────────────────────────────────────
async function salvarLancamento() {
  const valor     = parseFloat(document.getElementById('f-valor').value);
  const categoria = document.getElementById('f-categoria').value;
  const descricao = document.getElementById('f-descricao').value.trim();
  const data      = document.getElementById('f-data').value;
  const tipo      = document.getElementById('f-tipo').value;
  const estab     = document.getElementById('f-estab').value.trim();
  const nParcelas = tipo === 'Parcelado' ? (parseInt(document.getElementById('f-parcelas').value) || 1) : 1;

  if (!valor || valor <= 0) { showToast('Informe um valor válido', 'error'); return; }
  if (!categoria)           { showToast('Selecione uma categoria', 'error'); return; }
  if (!data)                { showToast('Informe a data', 'error'); return; }
  if (nParcelas < 1 || nParcelas > 48) { showToast('Parcelas entre 2 e 48', 'error'); return; }

  const btn = document.getElementById('btn-salvar');
  btn.disabled = true;
  btn.textContent = 'Salvando...';

  try {
    const [y,m,d] = data.split('-');
    const dataFmt = `${d}/${m}/${y}`;

    const result = await apiFetch('/api/lancamentos', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        data: dataFmt, descricao, categoria, valor,
        observacao: estab, tipo, parcelas: nParcelas,
      }),
    });

    await loadData();

    const msg = result.inserted > 1 ? `${result.inserted} parcelas salvas! ✓` : 'Lançamento salvo! ✓';
    showToast(msg, 'success');

    // Reset form
    document.getElementById('f-valor').value = '';
    document.getElementById('f-categoria').value = '';
    document.getElementById('f-descricao').value = '';
    document.getElementById('f-estab').value = '';
    document.getElementById('f-tipo').value = 'A vista';
    document.getElementById('parcel-group').style.display = 'none';
    document.getElementById('parcel-preview').style.display = 'none';
    setTodayDate();
    renderPainel();

  } catch(e) {
    showToast('Erro ao salvar: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Salvar lançamento';
  }
}

// ── NAVIGATION ────────────────────────────────────────────────────────────
function goTo(screen, btn) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('screen-'+screen).classList.add('active');
  if(btn) btn.classList.add('active');

  if (screen==='lancamentos') { activeFilter = 'Todos'; renderLancamentos(); }
  if (screen==='orcamento')   renderOrcamento();
  if (screen==='historico')   renderHistorico();
  if (screen==='painel')      renderPainel();
  if (screen==='detalhe')     {} // content set before calling goTo
  window.scrollTo(0,0);
}

function goToFromBtn(screen) {
  if (screen === 'lancamentos') activeFilter = 'Todos';
  const btns = document.querySelectorAll('.nav-btn');
  const map = {painel:0, lancar:1, lancamentos:2, orcamento:3, historico:4, detalhe:4};
  goTo(screen, btns[map[screen]]);
}

// ── MONTH PICKER ──────────────────────────────────────────────────────────
function buildMonthGrid() {
  const grid = document.getElementById('month-grid');
  grid.innerHTML = MONTHS.map(m => `
    <div class="month-opt ${m.label===currentMonth.label?'active':''}"
         onclick="selectMonth('${m.label}')">${m.label}</div>
  `).join('');
}

function openMonthPicker() {
  document.getElementById('month-modal').classList.add('open');
}

function closeMonthPicker(e) {
  if (e.target === document.getElementById('month-modal')) {
    document.getElementById('month-modal').classList.remove('open');
  }
}

function selectMonth(label) {
  currentMonth = MONTHS.find(m => m.label === label);
  document.getElementById('topbar-month').textContent = label;
  document.getElementById('month-modal').classList.remove('open');
  buildMonthGrid();
  // Re-render whichever screen is currently active
  const active = document.querySelector('.screen.active');
  const id = active ? active.id.replace('screen-', '') : 'painel';
  if (id === 'painel')      renderPainel();
  else if (id === 'lancamentos') { activeFilter = 'Todos'; renderLancamentos(); }
  else if (id === 'orcamento')   renderOrcamento();
  else if (id === 'historico')   renderHistorico();
  else renderPainel(); // fallback for detalhe screens
}

// ── TOAST ─────────────────────────────────────────────────────────────────
function showToast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ── REFRESH DATA ──────────────────────────────────────────────────────────
async function refreshData() {
  const btn = document.getElementById('refresh-btn');
  btn.classList.add('spinning');
  btn.disabled = true;
  try {
    await loadData();
    // Re-render whichever screen is active
    const active = document.querySelector('.screen.active');
    if (active) {
      const id = active.id.replace('screen-', '');
      if (id === 'painel')       renderPainel();
      if (id === 'lancamentos')  renderLancamentos();
      if (id === 'orcamento')    renderOrcamento();
      if (id === 'historico')    renderHistorico();
    }
    showToast('Atualizado ✓', 'success');
  } catch(e) {
    showToast('Erro ao atualizar', 'error');
  } finally {
    btn.classList.remove('spinning');
    btn.disabled = false;
  }
}

// ── CONFIRM MODAL ─────────────────────────────────────────────────────────
let confirmCallback = null;
function showConfirm(title, text, onOk) {
  document.getElementById('confirm-title').textContent = title;
  document.getElementById('confirm-text').textContent  = text;
  confirmCallback = onOk;
  document.getElementById('confirm-modal').classList.add('open');
}
function closeConfirm() {
  document.getElementById('confirm-modal').classList.remove('open');
  confirmCallback = null;
}
document.getElementById('confirm-ok-btn').onclick = () => {
  if (confirmCallback) confirmCallback();
  closeConfirm();
};

// ── DELETE SINGLE LANCAMENTO ───────────────────────────────────────────────
function confirmDeleteLanc(idx) {
  const l = allLancamentos[idx];
  if (!l) return;
  showConfirm(
    'Excluir lançamento',
    `Excluir "${l.descricao || l.categoria}" de ${formatMoney(l.valor)} em ${formatDate(l.data)}?`,
    () => deleteLanc(idx)
  );
}

async function deleteLanc(idx) {
  const l = allLancamentos[idx];
  if (!l) return;
  showToast('Excluindo...', 'success');
  try {
    await apiFetch(`/api/lancamentos/${l.id}`, { method: 'DELETE' });
    await loadData();
    showToast('Lançamento excluído ✓', 'success');
    // If on detalhe screen, go back to lancamentos
    const activeScreen = document.querySelector('.screen.active');
    if (activeScreen && activeScreen.id === 'screen-detalhe-lanc') {
      goToFromBtn('lancamentos');
    } else {
      renderLancamentos();
    }
    renderPainel();
  } catch(e) {
    showToast('Erro ao excluir: ' + e.message, 'error');
  }
}

// ── CLEAR MONTH ────────────────────────────────────────────────────────────
function confirmClearMonth(monthLabel) {
  const m = MONTHS.find(m => m.label === monthLabel);
  if (!m) return;
  const lancs = getLancamentosDoMes(m);
  if (lancs.length === 0) { showToast('Nenhum lançamento neste mês', 'error'); return; }
  showConfirm(
    `Limpar ${monthLabel}`,
    `Isso vai excluir todos os ${lancs.length} lançamento(s) de ${monthLabel}. Essa ação não pode ser desfeita.`,
    () => clearMonth(m)
  );
}

async function clearMonth(m) {
  showToast('Excluindo...', 'success');
  try {
    const lancs = getLancamentosDoMes(m);
    for (const l of lancs) {
      await apiFetch(`/api/lancamentos/${l.id}`, { method: 'DELETE' });
    }
    await loadData();
    showToast(`${m.label} limpo ✓`, 'success');
    renderHistorico();
    renderPainel();
  } catch(e) {
    showToast('Erro ao limpar mês: ' + e.message, 'error');
  }
}

// ── PARCEL AUTO-LAUNCH ─────────────────────────────────────────────────────
function onTipoChange() {
  const tipo = document.getElementById('f-tipo').value;
  const group = document.getElementById('parcel-group');
  group.style.display = tipo === 'Parcelado' ? 'block' : 'none';
  updateParcelPreview();
}

function updateParcelPreview() {
  const tipo     = document.getElementById('f-tipo').value;
  const parcelas = parseInt(document.getElementById('f-parcelas').value) || 0;
  const valor    = parseFloat(document.getElementById('f-valor').value) || 0;
  const data     = document.getElementById('f-data').value;
  const preview  = document.getElementById('parcel-preview');
  if (tipo !== 'Parcelado' || parcelas < 2 || !data) { preview.style.display='none'; return; }
  const [y,m,d] = data.split('-');
  const startDate = new Date(parseInt(y), parseInt(m)-1, parseInt(d));
  const endDate   = new Date(startDate);
  endDate.setMonth(endDate.getMonth() + parcelas - 1);
  const vlrParcela = valor / parcelas;
  const endLabel  = endDate.toLocaleDateString('pt-BR',{month:'short',year:'2-digit'});
  preview.style.display = 'block';
  preview.textContent   = `${parcelas}x de ${formatMoney(vlrParcela)} · vai até ${endLabel}`;
}

// ── PWA ───────────────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(()=>{});
}

// ── START ─────────────────────────────────────────────────────────────────
init();
</script>
