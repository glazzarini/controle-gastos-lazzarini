# Serve o build estático do Vite. /api/* é roteado pelo Ingress direto para o backend.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Service worker, registro e manifest sem cache: o PWA atualiza a cada deploy.
    location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /registerSW.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Assets com hash no nome: cache longo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Fallback de SPA.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
