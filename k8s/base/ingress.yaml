# ingress-nginx: /api/* → backend; o restante → frontend (Nginx com o build do Vite).
# Sem host na base: o overlay do DOKS adiciona o domínio.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: controle-gastos
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port: { name: http }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: { name: http }
