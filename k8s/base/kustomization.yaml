apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Base reaproveitável (Kind agora, DOKS depois). O Secret real é criado à parte com
# `kubectl create secret` — secret.example.yaml é só modelo e não entra aqui.
namespace: controle-gastos
labels:
  - pairs:
      app.kubernetes.io/part-of: controle-gastos
resources:
  - namespace.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - ingress.yaml
