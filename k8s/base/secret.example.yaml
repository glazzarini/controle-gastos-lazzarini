# MODELO — não aplicar com a connection string preenchida e nunca commitar o secret real.
# Crie o secret direto no cluster:
#   kubectl -n controle-gastos create secret generic controle-gastos-db \
#     --from-literal=connection-string='Host=aws-1-sa-east-1.pooler.supabase.com;Port=5432;Database=postgres;Username=postgres.<project-ref>;Password=<senha>;SSL Mode=Require;Pooling=true;Maximum Pool Size=5;Timeout=15;Keepalive=30'
apiVersion: v1
kind: Secret
metadata:
  name: controle-gastos-db
  namespace: controle-gastos
type: Opaque
stringData:
  connection-string: ""
